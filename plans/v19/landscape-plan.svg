<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">ЛД-01. Эскизный план благоустройства участка 20 на 30 метров</title>
  <desc id="desc">Дом, бетонный передний двор, правая зеленая полоса, баня три на семь метров, хозблок один на три метра, связанные дорожки, растения и освещение.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M8 0 0 4 8 8Z" fill="#2d332d"/>
    </marker>
    <pattern id="concrete" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 22V0H22" fill="none" stroke="#b4b0a7" stroke-width="1"/>
    </pattern>
    <pattern id="paving" width="18" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0H18M0 10H18M9 0V10" fill="none" stroke="#9a9487" stroke-width="1"/>
    </pattern>
    <style>
      text{font-family:Arial,sans-serif;fill:#20251f}.h{font-size:28px;font-weight:700}.sub{font-size:14px;letter-spacing:.08em}.label{font-size:15px;font-weight:700}.small{font-size:12px}.dim{font-size:13px;font-weight:700}.thin{stroke:#2d332d;stroke-width:1.5;fill:none}.dimline{stroke:#2d332d;stroke-width:1.2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="760" fill="#f4f1e8"/>
  <text x="54" y="48" class="sub">ДИМА · ОБЛАГОРАЖИВАНИЕ · ЛД-01 · ЭСКИЗ ДЛЯ СОГЛАСОВАНИЯ</text>
  <text x="54" y="86" class="h">План участка, покрытия, посадки и свет</text>
  <text x="54" y="112" class="small">Источник геометрии: лист 4 PDF. Баня и хозблок — требования заказчика. Отметки высот и водоотвод — после топосъёмки.</text>

  <!-- Plot: 12 px per metre, 20 x 30 m -->
  <g transform="translate(90 160)">
    <rect x="0" y="0" width="240" height="360" fill="#e7eadb" stroke="#20251f" stroke-width="3"/>
    <rect x="0" y="289.4" width="204" height="70.6" fill="url(#concrete)" stroke="#716d66" stroke-width="1.5"/>
    <rect x="204" y="0" width="36" height="360" fill="#cfdcb3" opacity=".95"/>

    <!-- House: axes 1.7..15.8 x 5.05..16.51 -->
    <rect x="20.4" y="161.9" width="169.2" height="137.5" fill="#f7f5ef" stroke="#20251f" stroke-width="3"/>
    <rect x="20.4" y="130" width="169.2" height="31.9" fill="#d7c4a8" stroke="#20251f" stroke-width="2"/>
    <text x="105" y="224" text-anchor="middle" class="label">ДОМ ПО PDF</text>
    <text x="105" y="243" text-anchor="middle" class="small">14,10 × 11,46 м по осям</text>
    <text x="105" y="149" text-anchor="middle" class="small">задняя терраса / мангальная</text>

    <!-- Bath and shed -->
    <rect x="12" y="12" width="36" height="84" fill="#c38b55" stroke="#20251f" stroke-width="2.5"/>
    <text x="30" y="48" text-anchor="middle" transform="rotate(-90 30 48)" class="label">БАНЯ 3 × 7 м</text>
    <rect x="0" y="324" width="12" height="36" fill="#6d7069" stroke="#20251f" stroke-width="2"/>
    <text x="-6" y="342" text-anchor="middle" transform="rotate(-90 -6 342)" class="small">ХОЗБЛОК 1 × 3</text>

    <!-- Connected paths -->
    <rect x="189.6" y="105.6" width="14.4" height="193.8" fill="url(#paving)" stroke="#716d66" stroke-width="1.5"/>
    <rect x="48" y="103.2" width="156" height="14.4" fill="url(#paving)" stroke="#716d66" stroke-width="1.5"/>
    <rect x="48" y="54" width="14.4" height="63.6" fill="url(#paving)" stroke="#716d66" stroke-width="1.5"/>

    <!-- Lawn -->
    <rect x="62.4" y="0" width="127.2" height="103.2" fill="#c8d79d" stroke="#96a576"/>
    <text x="126" y="48" text-anchor="middle" class="label">ЗАДНИЙ ГАЗОН</text>

    <!-- Planting symbols -->
    <g fill="#eae5c6" stroke="#6e7b49" stroke-width="1.3">
      <circle cx="222" cy="45" r="9"/><circle cx="222" cy="93" r="9"/><circle cx="222" cy="141" r="9"/><circle cx="222" cy="189" r="9"/>
    </g>
    <g fill="#ba84a1" stroke="#76506a" stroke-width="1.2">
      <circle cx="73" cy="122" r="4"/><circle cx="85" cy="122" r="4"/><circle cx="97" cy="122" r="4"/><circle cx="109" cy="122" r="4"/><circle cx="121" cy="122" r="4"/><circle cx="133" cy="122" r="4"/><circle cx="145" cy="122" r="4"/><circle cx="157" cy="122" r="4"/>
    </g>
    <g fill="#655e3c" stroke="#2d332d">
      <circle cx="196.8" cy="176" r="2.7"/><circle cx="196.8" cy="206" r="2.7"/><circle cx="196.8" cy="236" r="2.7"/><circle cx="196.8" cy="266" r="2.7"/>
      <circle cx="72" cy="110" r="2.7"/><circle cx="114" cy="110" r="2.7"/><circle cx="156" cy="110" r="2.7"/>
    </g>

    <!-- Street -->
    <rect x="-20" y="375" width="280" height="38" fill="#666b6e"/>
    <text x="120" y="399" text-anchor="middle" fill="#fff" style="font-family:Arial,sans-serif;font-size:14px;font-weight:700">УЛИЦА / ВЪЕЗД</text>

    <!-- Dimensions -->
    <path d="M0-18V-4M240-18V-4" class="thin"/>
    <path d="M0-12H240" class="dimline"/>
    <text x="120" y="-18" text-anchor="middle" class="dim">20,00 м</text>
    <path d="M-26 0H-8M-26 360H-8" class="thin"/>
    <path d="M-20 0V360" class="dimline"/>
    <text x="-32" y="180" text-anchor="middle" transform="rotate(-90 -32 180)" class="dim">30,00 м</text>
    <path d="M0 102H12M0 12H12" class="thin"/>
    <path d="M6 12V102" class="dimline"/>
    <text x="-2" y="57" text-anchor="middle" transform="rotate(-90 -2 57)" class="dim">1,00 м от левого забора</text>
    <path d="M12 0V12M48 0V12" class="thin"/>
    <path d="M12 6H48" class="dimline"/>
    <text x="30" y="-1" text-anchor="middle" class="dim">1,00 м сзади</text>
    <path d="M189.6 307H204M189.6 317H204" class="thin"/>
    <path d="M196.8 307V317" class="dimline"/>
    <text x="207" y="314" class="dim">дорожка 1,20 м</text>
    <text x="222" y="252" text-anchor="middle" transform="rotate(-90 222 252)" class="small">ЗЕЛЁНАЯ ПОЛОСА 3,00 м</text>
  </g>

  <g transform="translate(405 160)">
    <rect x="0" y="0" width="620" height="520" rx="10" fill="#fffdf7" stroke="#c7c0b1"/>
    <text x="28" y="42" class="h" style="font-size:22px">Экспликация и привязки</text>
    <g transform="translate(28 72)">
      <text x="0" y="0" class="label">Покрытия</text>
      <text x="0" y="28" class="small">П-01 · передний двор — преимущественно бетон; границы уточнить после водоотвода.</text>
      <text x="0" y="50" class="small">П-02 · проход справа — 1,20 м; соединяет въезд, дом, задний двор и баню.</text>
      <text x="0" y="72" class="small">П-03 · поперечная дорожка — 1,20 м; завершает маршрут у бани.</text>

      <text x="0" y="112" class="label">Растения — взрослый размер</text>
      <text x="0" y="140" class="small">Р-01 · гортензия метельчатая — 4 шт., H 1,5–2,0 м, W 1,2–1,5 м.</text>
      <text x="0" y="162" class="small">Р-02 · спирея компактная — группами, H 0,6–0,9 м.</text>
      <text x="0" y="184" class="small">Р-03 · мискантус — ритм в правой полосе, H 1,2–1,6 м.</text>
      <text x="0" y="206" class="small">Р-04 · лаванда + шалфей — куртины у террасы, шаг после посадочного расчёта.</text>
      <text x="0" y="228" class="small">Р-05 · можжевельник — только после проверки безопасности и проходов.</text>

      <text x="0" y="268" class="label">Освещение</text>
      <text x="0" y="296" class="small">L-01 · болларды 3000K вдоль функционального маршрута, без слепящего света.</text>
      <text x="0" y="318" class="small">L-02 · вход, ворота, ступени, баня и мангальная — отдельные группы.</text>
      <text x="0" y="340" class="small">Количество и мощность — только после светорасчёта и плана ЭОМ.</text>

      <rect x="0" y="382" width="564" height="84" rx="8" fill="#fff1df" stroke="#e4a766"/>
      <text x="18" y="410" class="label">Не строить по этому листу</text>
      <text x="18" y="434" class="small">Нужны: топосъёмка, фактические границы, отметки, схема ливневого сброса,</text>
      <text x="18" y="454" class="small">проект оснований покрытий, проверка нормативных отступов и посадочный план.</text>
    </g>
  </g>
</svg>
