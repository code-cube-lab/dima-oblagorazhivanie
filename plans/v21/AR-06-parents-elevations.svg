<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>.b{fill:#fff}.f{fill:none;stroke:#111;stroke-width:2}.wall{fill:#f4f4f2;stroke:#111;stroke-width:2}.obj{fill:#e7ddd2;stroke:#111;stroke-width:1.5}.t{font:18px Arial}.s{font:14px Arial}.h{font:bold 25px Arial}.dim{stroke:#b12f2f;stroke-width:1.5}.warn{fill:#fff3d7;stroke:#b66a00;stroke-width:2}</style></defs>
  <rect class="b" width="1600" height="1000"/><rect class="f" x="25" y="25" width="1550" height="950"/>
  <text class="h" x="50" y="65">АР-06. Спальня родителей — развёртки четырёх стен</text><text class="s" x="50" y="92">Кровать Нордик 180: 2030×1850×980 мм. Чистая высота модели 2900. Выводы уточнить после обмера.</text>
  <g transform="translate(60 140)"><text class="t" y="-15">А. Стена изголовья, L=4430</text><rect class="wall" width="680" height="280"/><rect class="obj" x="185" y="105" width="310" height="175"/><text class="s" x="235" y="200">Нордик 180 · габарит 1850×2030×980</text><rect class="obj" x="95" y="210" width="70" height="70"/><rect class="obj" x="515" y="210" width="70" height="70"/><circle cx="140" cy="120" r="10"/><circle cx="540" cy="120" r="10"/><text class="s" x="80" y="308">бра по осям тумб, розетки/USB + выключатели у кровати</text></g>
  <g transform="translate(835 140)"><text class="t" y="-15">Б. Стена входа, L=4430</text><rect class="wall" width="680" height="280"/><rect class="b" stroke="#111" stroke-width="2" x="470" y="80" width="125" height="200"/><text class="s" x="476" y="70">дверь 900 — проверить</text><rect class="obj" x="70" y="185" width="180" height="55"/><text class="s" x="83" y="218">туалетный стол 1100</text></g>
  <g transform="translate(60 520)"><text class="t" y="-15">В. Левая стена, L=3640</text><rect class="wall" width="680" height="250"/><rect class="b" stroke="#111" stroke-width="2" x="35" y="45" width="150" height="205"/><text class="s" x="45" y="35">выход на общий балкон</text><text class="s" x="250" y="125">свободная стена; не перекрывать путь к балкону</text></g>
  <g transform="translate(835 520)"><text class="t" y="-15">Г. Правая стена, L=3640</text><rect class="wall" width="680" height="250"/><text class="s" x="205" y="125">проход к гардеробной; встроенную мебель — по обмеру</text></g>
  <rect class="warn" x="50" y="810" width="900" height="120"/><text class="s" x="70" y="845">Рендеры рядом на сайте: CAM_14 и CAM_41. Перед мебельным производством снять чистовые размеры и проверить траектории дверей.</text><text class="s" x="70" y="875">СПДС-ориентир: ГОСТ Р 21.101-2020, ГОСТ 21.501-2018. Статус: эскиз/координация.</text>
  <rect class="f" x="980" y="820" width="595" height="155"/><path class="f" d="M980 870h595M1240 820v155M1455 820v155M980 925h595"/><text class="s" x="995" y="848">Дима — благоустройство</text><text class="t" x="995" y="900">Спальня родителей</text><text class="s" x="995" y="948">Развёртки стен</text><text class="s" x="1260" y="848">Стадия ЭП</text><text class="s" x="1260" y="900">Масштаб граф.</text><text class="s" x="1470" y="848">АР-06</text><text class="s" x="1470" y="900">v21</text>
</svg>
