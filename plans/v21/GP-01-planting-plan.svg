  <text x="60" y="850" font-family="Arial" font-size="15">СПДС-ориентир: ГОСТ Р 21.101-2020; генеральные планы — ГОСТ 21.508-2020.</text>
  <text x="60" y="878" font-family="Arial" font-size="15">Перед разбивкой: топосъёмка, отметки, дренаж, полив, освещение и фактические подземные сети.</text>
  <text x="60" y="906" font-family="Arial" font-size="15">Координаты P01–P06 и количество растений совпадают с моделью Cinema 4D и CSV-ведомостью.</text>
  <text x="60" y="934" font-family="Consolas" font-size="13">Участок 20×30 м · баня 3×7 м · отступы 1 м · хозблок 1×3 м.</text>
