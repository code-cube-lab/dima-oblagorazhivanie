<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>.b{fill:#fff}.f{fill:none;stroke:#111;stroke-width:2}.wall{fill:#f4f4f2;stroke:#111;stroke-width:2}.obj{fill:#dfeade;stroke:#111;stroke-width:1.5}.gym{fill:#e7b8ca;stroke:#111;stroke-width:1.5}.t{font:18px Arial}.s{font:14px Arial}.h{font:bold 25px Arial}.warn{fill:#fff3d7;stroke:#b66a00;stroke-width:2}</style></defs>
  <rect class="b" width="1600" height="1000"/><rect class="f" x="25" y="25" width="1550" height="950"/>
  <text class="h" x="50" y="65">АР-07. Детская Дарины — развёртки четырёх стен</text><text class="s" x="50" y="92">Комната 4450 × 3950. Новая балконная дверь — изменение заказчика, только после конструктивного расчёта.</text>
  <g transform="translate(60 140)"><text class="t" y="-15">А. Фасадная стена, L=4450</text><rect class="wall" width="680" height="280"/><rect class="b" stroke="#111" stroke-width="2" x="235" y="35" width="170" height="245"/><text class="s" x="208" y="310">новая дверь на общий балкон, порог и безопасное стекло по проекту</text></g>
  <g transform="translate(835 140)"><text class="t" y="-15">Б. Стена рабочего места, L=4450</text><rect class="wall" width="680" height="280"/><rect class="obj" x="380" y="185" width="190" height="75"/><text class="s" x="396" y="222">Милна 1200×600×750</text><rect class="obj" x="585" y="60" width="65" height="220"/><text class="s" x="570" y="45">шкаф 1250</text><text class="s" x="345" y="310">2×230 В + USB/данные над столом; свет слева для правши</text></g>
  <g transform="translate(60 520)"><text class="t" y="-15">В. Спортивная стена, L=3950</text><rect class="wall" width="680" height="250"/><rect class="obj" x="35" y="45" width="28" height="205"/><text class="s" x="80" y="85">гимнастическая стенка</text><rect class="gym" x="80" y="180" width="170" height="55"/><text class="s" x="112" y="215">мат 1150×1700</text><text class="s" x="320" y="145">зона без острых углов и навесной мебели</text></g>
  <g transform="translate(835 520)"><text class="t" y="-15">Г. Стена кровати, L=3950</text><rect class="wall" width="680" height="250"/><rect class="obj" x="120" y="112" width="250" height="138"/><text class="s" x="150" y="183">Пенни-1 940×2040×760</text><text class="s" x="390" y="190">ночник + розетка вне зоны головы</text></g>
  <rect class="warn" x="50" y="810" width="900" height="120"/><text class="s" x="70" y="845">Рендеры рядом на сайте: CAM_15 и CAM_42. Проверить безопасные крепления спортстенки и ограждение балкона.</text><text class="s" x="70" y="875">СПДС-ориентир: ГОСТ Р 21.101-2020, ГОСТ 21.501-2018. Статус: эскиз/координация.</text>
  <rect class="f" x="980" y="820" width="595" height="155"/><path class="f" d="M980 870h595M1240 820v155M1455 820v155M980 925h595"/><text class="s" x="995" y="848">Дима — благоустройство</text><text class="t" x="995" y="900">Детская Дарины</text><text class="s" x="995" y="948">Развёртки стен</text><text class="s" x="1260" y="848">Стадия ЭП</text><text class="s" x="1260" y="900">Масштаб граф.</text><text class="s" x="1470" y="848">АР-07</text><text class="s" x="1470" y="900">v21</text>
</svg>
