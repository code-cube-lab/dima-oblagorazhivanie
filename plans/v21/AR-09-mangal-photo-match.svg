<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c95f38"/></marker>
    <pattern id="brick" width="56" height="26" patternUnits="userSpaceOnUse">
      <rect width="56" height="26" fill="#87492f"/>
      <path d="M0 25.3H56M0 0V26M28 0V26" fill="none" stroke="#2b2522" stroke-width="2"/>
    </pattern>
    <style>
      .bg{fill:#f4f0e7}.ink{stroke:#14343d;fill:none;stroke-width:4}.thin{stroke:#14343d;fill:none;stroke-width:2}
      .dim{stroke:#c95f38;fill:none;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}
      .ext{stroke:#c95f38;fill:none;stroke-width:1.5}.txt{font-family:'Segoe UI',Arial,sans-serif;fill:#14343d}
      .h1{font:700 38px Georgia,serif}.h2{font:700 24px 'Segoe UI',Arial,sans-serif}.label{font:600 17px 'Segoe UI',Arial,sans-serif}
      .note{font:15px 'Segoe UI',Arial,sans-serif}.small{font:13px 'Segoe UI',Arial,sans-serif}.dtext{font:700 16px Consolas,monospace;fill:#c95f38}
      .paper{fill:#fffdf8;stroke:#14343d;stroke-width:3}.stone{fill:#383b3b;stroke:#14343d;stroke-width:3}
      .metal{fill:#b8c2c2;stroke:#14343d;stroke-width:3}.void{fill:#171919;stroke:#14343d;stroke-width:3}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1100"/>
  <text class="txt h1" x="70" y="72">АР-09 · Мангальная по фото и плану первого этажа</text>
  <text class="txt note" x="70" y="108">Координационный лист · внешний задний правый угол террасы · размеры в мм · мойка встроена в столешницу</text>

  <rect class="paper" x="60" y="145" width="715" height="715" rx="18"/>
  <text class="txt h2" x="90" y="190">ПЛАН · L-образная зона 1640 × 1990</text>
  <text class="txt small" x="90" y="220">Верх листа — внешний край террасы; низ листа — направление к дому</text>
  <path d="M180 330H590V735H430V500H180Z" fill="url(#brick)" stroke="#14343d" stroke-width="4"/>
  <rect class="stone" x="180" y="330" width="410" height="105"/>
  <rect class="stone" x="485" y="330" width="105" height="405"/>
  <rect x="404" y="330" width="186" height="195" fill="url(#brick)" stroke="#14343d" stroke-width="4"/>
  <rect class="metal" x="237" y="350" width="94" height="62" rx="16"/>
  <ellipse class="void" cx="284" cy="381" rx="34" ry="22"/>
  <path class="thin" d="M340 405v-52h28v18h-22"/>
  <circle class="void" cx="537" cy="475" r="36"/>
  <text class="txt label" x="206" y="470">СТОЛЕШНИЦА С МОЙКОЙ</text>
  <text class="txt small" x="205" y="495">мойка D490 · смеситель</text>
  <text class="txt label" x="462" y="565" transform="rotate(90 462 565)">ВОЗВРАТ К ДОМУ 1990</text>
  <text class="txt label" x="420" y="300">ПЕЧНОЙ МАССИВ / ТОПКА</text>
  <path class="thin" d="M590 735H660M590 330H660M430 760v60M590 760v60"/>
  <line class="dim" x1="650" y1="330" x2="650" y2="735"/>
  <text class="dtext" x="666" y="545" transform="rotate(90 666 545)">1990</text>
  <line class="ext" x1="180" y1="300" x2="180" y2="255"/><line class="ext" x1="590" y1="300" x2="590" y2="255"/>
  <line class="dim" x1="180" y1="270" x2="590" y2="270"/><text class="dtext" x="360" y="260">1640</text>
  <line class="dim" x1="430" y1="795" x2="590" y2="795"/><text class="dtext" x="488" y="787">840</text>
  <path d="M310 795h70l-35 65z" fill="#c95f38"/><text class="txt label" x="90" y="835">К ДОМУ / вход в террасу</text>

  <rect class="paper" x="805" y="145" width="735" height="715" rx="18"/>
  <text class="txt h2" x="835" y="190">ВИД ИЗНУТРИ ТЕРРАСЫ · как на фото заказчика</text>
  <rect x="930" y="285" width="445" height="490" fill="url(#brick)" stroke="#14343d" stroke-width="4"/>
  <rect class="void" x="1190" y="420" width="145" height="145"/>
  <rect class="void" x="1190" y="620" width="145" height="105"/>
  <rect class="stone" x="835" y="570" width="425" height="28"/>
  <path d="M835 598H910V775H835Z" fill="url(#brick)" stroke="#14343d" stroke-width="4"/>
  <path d="M1115 598H1180V775H1115Z" fill="url(#brick)" stroke="#14343d" stroke-width="4"/>
  <ellipse class="metal" cx="1060" cy="580" rx="52" ry="14"/>
  <ellipse class="void" cx="1060" cy="580" rx="36" ry="9"/>
  <path class="thin" d="M1110 570v-75h28v30h-22"/>
  <rect class="void" x="1045" y="650" width="72" height="82" rx="8"/>
  <rect class="void" x="1052" y="742" width="58" height="24" rx="5"/>
  <text class="txt small" x="945" y="820">Мойка находится в горизонтальной столешнице, а не стоит сверху.</text>
  <line class="ext" x1="1395" y1="285" x2="1465" y2="285"/><line class="ext" x1="1395" y1="775" x2="1465" y2="775"/>
  <line class="dim" x1="1450" y1="285" x2="1450" y2="775"/><text class="dtext" x="1468" y="545" transform="rotate(90 1468 545)">≈3120 · уточнить обмером</text>
  <line class="ext" x1="835" y1="570" x2="805" y2="570"/><line class="ext" x1="835" y1="598" x2="805" y2="598"/>
  <line class="dim" x1="820" y1="570" x2="820" y2="598"/><text class="dtext" x="836" y="558">столешница 900–950 AFFL</text>

  <rect x="60" y="885" width="1040" height="165" fill="#fffdf8" stroke="#14343d" stroke-width="3"/>
  <text class="txt h2" x="85" y="925">Обязательные проверки до строительства</text>
  <text class="txt note" x="85" y="958">1. Обмерить существующую кладку, высоту плиты террасы и все привязки.</text>
  <text class="txt note" x="85" y="987">2. Печник рассчитывает топку, дымоход, разделки, основание и пожарные отступы.</text>
  <text class="txt note" x="85" y="1016">3. ВК подтверждает мойку, ХВС/ГВС/слив и зимнее отключение; окна дома не перекрывать.</text>

  <rect x="1100" y="885" width="440" height="165" fill="#fffdf8" stroke="#14343d" stroke-width="3"/>
  <path class="thin" d="M1100 935h440M1225 885v165M1405 885v165"/>
  <text class="txt small" x="1118" y="910">Проект</text><text class="txt label" x="1118" y="962">ДИМА · БЛАГОУСТРОЙСТВО</text>
  <text class="txt small" x="1243" y="910">Лист</text><text class="txt h2" x="1243" y="970">АР-09</text>
  <text class="txt small" x="1423" y="910">Статус</text><text class="txt label" x="1423" y="957">ЭСКИЗ</text><text class="txt small" x="1423" y="985">v20.2</text><text class="txt small" x="1423" y="1012">31.07.2026</text>
</svg>
