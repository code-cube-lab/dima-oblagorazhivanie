<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
  <defs>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#173841}.title{font:700 38px Georgia,serif}
      .sub{font-size:18px;fill:#557078}.h{font-size:19px;font-weight:700}.p{font-size:14px}.tiny{font-size:11px}
      .panel{fill:#fffdf8;stroke:#173841;stroke-width:3}.cab{fill:#cdb79d;stroke:#173841;stroke-width:2}
      .upper{fill:#a99680;stroke:#173841;stroke-width:2}.counter{fill:#eee2d2;stroke:#173841;stroke-width:2}
      .power{fill:#fff0e6;stroke:#b96039;stroke-width:3}.water{fill:#e5f3f7;stroke:#357088;stroke-width:3}
      .vent{fill:#eaf2e8;stroke:#648367;stroke-width:3}.line{fill:none;stroke:#b96039;stroke-width:2;stroke-dasharray:7 5}
      .row1{fill:#f8f5ee}.row2{fill:#edf3f2}.grid{stroke:#9cb0b2;stroke-width:1}
    </style>
  </defs>
  <rect width="1900" height="1200" fill="#f5f1e8"/>
  <text x="55" y="65" class="title">ЭОМ/ВК-20.01 · Точные точки кухни — задание мастерам</text>
  <text x="55" y="100" class="sub">Вариант A · X — от левого чистового торца линии 5530 · Z — центр точки от чистого пола · все значения предварительные до паспортов техники</text>

  <g transform="translate(55 145)">
    <rect width="1790" height="475" rx="12" class="panel"/>
    <line x1="80" y1="405" x2="1110" y2="405" stroke="#173841" stroke-width="5"/>
    <g transform="translate(120 120)">
      <rect width="95" height="285" class="cab"/><rect x="95" width="95" height="285" class="cab"/>
      <rect x="190" y="175" width="48" height="110" class="cab"/><rect x="238" y="175" width="127" height="110" class="cab"/>
      <rect x="365" y="175" width="143" height="110" class="cab"/><rect x="508" y="175" width="95" height="110" class="cab"/>
      <rect x="603" y="175" width="127" height="110" class="cab"/><rect x="730" y="175" width="95" height="110" class="cab"/>
      <rect x="190" y="160" width="635" height="15" class="counter"/>
      <rect x="238" y="35" width="127" height="100" class="upper"/><rect x="365" y="35" width="143" height="100" class="upper"/>
      <rect x="508" y="35" width="95" height="100" class="upper"/><rect x="603" y="35" width="127" height="100" class="upper"/>
      <rect x="730" y="35" width="95" height="100" class="upper"/>
    </g>
    <g>
      <circle cx="190" cy="270" r="16" class="power"/><text x="190" y="275" text-anchor="middle" class="tiny">E01</text>
      <circle cx="285" cy="270" r="16" class="power"/><text x="285" y="275" text-anchor="middle" class="tiny">E02</text>
      <circle cx="556" cy="345" r="16" class="power"/><text x="556" y="350" text-anchor="middle" class="tiny">E03</text>
      <circle cx="945" cy="345" r="16" class="power"/><text x="945" y="350" text-anchor="middle" class="tiny">E04</text>
      <circle cx="556" cy="205" r="16" class="power"/><text x="556" y="210" text-anchor="middle" class="tiny">E05</text>
      <circle cx="473" cy="272" r="16" class="power"/><text x="473" y="277" text-anchor="middle" class="tiny">E06</text>
      <circle cx="720" cy="272" r="16" class="power"/><text x="720" y="277" text-anchor="middle" class="tiny">E07</text>
      <circle cx="825" cy="345" r="16" class="water"/><text x="825" y="350" text-anchor="middle" class="tiny">W01</text>
      <circle cx="865" cy="345" r="16" class="water"/><text x="865" y="350" text-anchor="middle" class="tiny">W02</text>
      <circle cx="556" cy="160" r="16" class="vent"/><text x="556" y="165" text-anchor="middle" class="tiny">V01</text>
    </g>
    <path d="M190 255V75H1175" class="line"/><path d="M285 255V95H1175" class="line"/>
    <path d="M556 330V115H1175" class="line"/><path d="M945 330V135H1175" class="line"/>
    <text x="1200" y="80" class="p">E01 · холодильник: X=450; Z=300; доступ из соседней секции</text>
    <text x="1200" y="102" class="p">E02 · духовой шкаф: X=1050; Z=300; не за корпусом</text>
    <text x="1200" y="124" class="p">E03 · панель: X=2850; Z=300; клеммная коробка/розетка по паспорту</text>
    <text x="1200" y="146" class="p">E04 · ПММ: X=5050; Z=300; в модуле мойки, не за машиной</text>
    <text x="1200" y="180" class="p">E05 · вытяжка: X=2850; Z=2100; уточнить по модели вытяжки</text>
    <text x="1200" y="202" class="p">E06/E07 · фартук: X=2200/3850; Z=1100; по 2×230 В</text>
    <text x="1200" y="236" class="p">W01 · ХВС/ГВС: X=4500; Z=550; запорные краны доступны</text>
    <text x="1200" y="258" class="p">W02 · канализация: X=4500; Z=350; диаметр/уклон — проект ВК</text>
    <text x="1200" y="292" class="p">V01 · вытяжка: ось X=2850; Z по расчёту ОВ и паспорту</text>
    <rect x="1175" y="330" width="560" height="105" rx="9" fill="#fff0e8" stroke="#b96039" stroke-width="2"/>
    <text x="1200" y="362" class="h">Нельзя</text>
    <text x="1200" y="390" class="p">Розетки за холодильником/ПММ/духовкой; соединения под мойкой без доступа;</text>
    <text x="1200" y="414" class="p">штроба в несущей конструкции без конструктора; общая линия для мощной техники.</text>
  </g>

  <text x="55" y="675" class="h">Реестр точек и задание электрику</text>
  <g transform="translate(55 705)">
    <rect width="1790" height="395" fill="#fffdf8" stroke="#173841" stroke-width="2"/>
    <rect width="1790" height="42" fill="#173841"/>
    <g fill="#fff" font-size="13" font-weight="700">
      <text x="12" y="27">Код</text><text x="95" y="27">Назначение</text><text x="385" y="27">X, мм</text><text x="470" y="27">Z, мм</text>
      <text x="555" y="27">Исполнение/доступ</text><text x="980" y="27">Линия и защита</text><text x="1325" y="27">Что проверить до монтажа</text>
    </g>
    <g font-size="12">
      <rect y="42" width="1790" height="44" class="row1"/><text x="12" y="69">E01</text><text x="95" y="69">Холодильник</text><text x="385" y="69">450</text><text x="470" y="69">300</text><text x="555" y="69">в соседнем сервисном модуле</text><text x="980" y="69">отдельная рекоменд.; расчёт ЭОМ</text><text x="1325" y="69">паспорт, шнур, вентиляционные зазоры</text>
      <rect y="86" width="1790" height="44" class="row2"/><text x="12" y="113">E02</text><text x="95" y="113">Духовой шкаф</text><text x="385" y="113">1050</text><text x="470" y="113">300</text><text x="555" y="113">в соседнем модуле, доступ спереди</text><text x="980" y="113">отдельная; кабель/автомат по расчёту</text><text x="1325" y="113">мощность, тип вилки/клемм</text>
      <rect y="130" width="1790" height="44" class="row1"/><text x="12" y="157">E03</text><text x="95" y="157">Индукционная панель</text><text x="385" y="157">2850</text><text x="470" y="157">300</text><text x="555" y="157">в соседней секции, не под горячей зоной</text><text x="980" y="157">отдельная линия; мощность ориентир 7 кВт</text><text x="1325" y="157">точная модель и схема производителя</text>
      <rect y="174" width="1790" height="44" class="row2"/><text x="12" y="201">E04</text><text x="95" y="201">Посудомоечная машина</text><text x="385" y="201">5050</text><text x="470" y="201">300</text><text x="555" y="201">в модуле мойки, выше дна, сервисный доступ</text><text x="980" y="201">отдельная рекоменд.; УЗО/диф — расчёт</text><text x="1325" y="201">шланги, аквастоп, зона возможной протечки</text>
      <rect y="218" width="1790" height="44" class="row1"/><text x="12" y="245">E05</text><text x="95" y="245">Вытяжка</text><text x="385" y="245">2850</text><text x="470" y="245">2100</text><text x="555" y="245">за декоративным коробом, доступ через шкаф</text><text x="980" y="245">группа кухни; уточнить ЭОМ</text><text x="1325" y="245">высота установки и сечение канала</text>
      <rect y="262" width="1790" height="44" class="row2"/><text x="12" y="289">E06–E07</text><text x="95" y="289">Фартук, 2 блока по 2 розетки</text><text x="385" y="289">2200/3850</text><text x="470" y="289">1100</text><text x="555" y="289">не ближе горячей/мокрой зоны по нормам</text><text x="980" y="289">2 группы по расчёту нагрузки</text><text x="1325" y="289">чайник, кофемашина, миксер, свободная точка</text>
      <rect y="306" width="1790" height="44" class="row1"/><text x="12" y="333">W01–W02</text><text x="95" y="333">Мойка: ХВС/ГВС/слив</text><text x="385" y="333">4500</text><text x="470" y="333">550/350</text><text x="555" y="333">краны, фильтр и сифон доступны</text><text x="980" y="333">диаметры и уклон назначает ВК</text><text x="1325" y="333">ось мойки, измельчитель, фильтр, ПММ</text>
      <rect y="350" width="1790" height="44" class="row2"/><text x="12" y="377">S01</text><text x="95" y="377">LED рабочей поверхности</text><text x="385" y="377">по шкафам</text><text x="470" y="377">1450–1650</text><text x="555" y="377">БП в доступном шкафу, не замуровывать</text><text x="980" y="377">отдельное управление L02</text><text x="1325" y="377">профиль, мощность ленты, охлаждение БП</text>
    </g>
  </g>
  <text x="55" y="1150" class="p">Важно: окончательные кабели, автоматы, УЗО/дифзащита, уравнивание потенциалов и IP назначает лицензированный проектировщик ЭОМ по фактической мощности и действующим нормам.</text>
</svg>
