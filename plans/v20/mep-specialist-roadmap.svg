<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>
    .bg{fill:#f4f1ea}.sheet{fill:#fff;stroke:#1f2b35;stroke-width:2}.card{fill:#eef2f4;stroke:#36434e;stroke-width:2}.gate{fill:#fff2db;stroke:#c16b20;stroke-width:2}.pass{fill:#e3f5e9;stroke:#27864d;stroke-width:2}.t{font:18px Arial;fill:#18232d}.s{font:14px Arial;fill:#34414d}.h{font:bold 28px Arial;fill:#17212b}.hh{font:bold 20px Arial;fill:#17212b}.arr{stroke:#6a7680;stroke-width:3;fill:none}
  </style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6a7680"/></marker></defs>
  <rect class="bg" width="1600" height="1000"/><rect class="sheet" x="24" y="22" width="1552" height="956" rx="8"/>
  <text class="h" x="55" y="66">И-01. Порядок действий Дмитрия и ТЗ специалистам</text>
  <text class="s" x="55" y="94">Каждый следующий этап начинается после приёмки результата предыдущего. Параллельные работы показаны в одной колонке.</text>

  <rect class="card" x="55" y="130" width="230" height="150" rx="8"/>
  <text class="hh" x="75" y="165">1. Обмер</text><text class="s" x="75" y="195">• геодезия участка</text><text class="s" x="75" y="218">• все помещения</text><text class="s" x="75" y="241">• окна, двери, высоты</text><text class="s" x="75" y="264">Результат: обмерный DWG/PDF</text>
  <path class="arr" marker-end="url(#a)" d="M285 205H330"/>
  <rect class="gate" x="330" y="130" width="230" height="150" rx="8"/>
  <text class="hh" x="350" y="165">2. Исходные данные</text><text class="s" x="350" y="195">• ТУ газ/электричество</text><text class="s" x="350" y="218">• вода и канализация</text><text class="s" x="350" y="241">• анализ воды</text><text class="s" x="350" y="264">• конструктив коробки</text>
  <path class="arr" marker-end="url(#a)" d="M560 205H605"/>
  <rect class="card" x="605" y="130" width="300" height="150" rx="8"/>
  <text class="hh" x="625" y="165">3. Проекты параллельно</text><text class="s" x="625" y="195">архитектор + конструктор</text><text class="s" x="625" y="218">ОВиК + ВК + ЭОМ</text><text class="s" x="625" y="241">газовая организация</text><text class="s" x="625" y="264">кухня/мебель + ландшафт</text>
  <path class="arr" marker-end="url(#a)" d="M905 205H950"/>
  <rect class="gate" x="950" y="130" width="280" height="150" rx="8"/>
  <text class="hh" x="970" y="165">4. Координация BIM/C4D</text><text class="s" x="970" y="195">• без пересечений</text><text class="s" x="970" y="218">• одинаковые коды</text><text class="s" x="970" y="241">• сервисные доступы</text><text class="s" x="970" y="264">Результат: сводный лист</text>
  <path class="arr" marker-end="url(#a)" d="M1230 205H1275"/>
  <rect class="pass" x="1275" y="130" width="270" height="150" rx="8"/>
  <text class="hh" x="1295" y="165">5. Разрешение к работам</text><text class="s" x="1295" y="195">подписанные рабочие листы</text><text class="s" x="1295" y="218">спецификации и смета</text><text class="s" x="1295" y="241">ответственные исполнители</text><text class="s" x="1295" y="264">график и акты скрытых работ</text>

  <text class="hh" x="55" y="335">Очередность на объекте после коробки</text>
  <rect class="card" x="55" y="365" width="280" height="180" rx="8"/><text class="t" x="75" y="400">А. Подготовка</text><text class="s" x="75" y="430">обследование, просушка</text><text class="s" x="75" y="453">временное электричество</text><text class="s" x="75" y="476">защита окон/проёмов</text><text class="s" x="75" y="499">разметка всех трасс</text><text class="s" x="75" y="522">акт готовности</text>
  <path class="arr" marker-end="url(#a)" d="M335 455H375"/>
  <rect class="card" x="375" y="365" width="280" height="180" rx="8"/><text class="t" x="395" y="400">Б. Черновые сети</text><text class="s" x="395" y="430">ВК и канализация</text><text class="s" x="395" y="453">отопление/котельная</text><text class="s" x="395" y="476">вентиляция</text><text class="s" x="395" y="499">электрика/слаботочка</text><text class="s" x="395" y="522">фото + акты скрытых работ</text>
  <path class="arr" marker-end="url(#a)" d="M655 455H695"/>
  <rect class="gate" x="695" y="365" width="280" height="180" rx="8"/><text class="t" x="715" y="400">В. Испытания</text><text class="s" x="715" y="430">опрессовка отопления</text><text class="s" x="715" y="453">пролив канализации</text><text class="s" x="715" y="476">замер изоляции ЭОМ</text><text class="s" x="715" y="499">проверка воздуховодов</text><text class="s" x="715" y="522">протоколы — до отделки</text>
  <path class="arr" marker-end="url(#a)" d="M975 455H1015"/>
  <rect class="card" x="1015" y="365" width="240" height="180" rx="8"/><text class="t" x="1035" y="400">Г. Отделка</text><text class="s" x="1035" y="430">штукатурка/стяжки</text><text class="s" x="1035" y="453">гидроизоляция</text><text class="s" x="1035" y="476">плитка/покраска</text><text class="s" x="1035" y="499">чистовые потолки</text><text class="s" x="1035" y="522">не закрывать ревизии</text>
  <path class="arr" marker-end="url(#a)" d="M1255 455H1295"/>
  <rect class="pass" x="1295" y="365" width="250" height="180" rx="8"/><text class="t" x="1315" y="400">Д. Монтаж и пуск</text><text class="s" x="1315" y="430">мебель/сантехника</text><text class="s" x="1315" y="453">свет/автоматика</text><text class="s" x="1315" y="476">газ — только допуск</text><text class="s" x="1315" y="499">балансировка ОВиК</text><text class="s" x="1315" y="522">исполнительные схемы</text>

  <text class="hh" x="55" y="610">Что Дмитрий передаёт каждому специалисту</text>
  <rect class="sheet" x="55" y="640" width="480" height="265" rx="8"/>
  <text class="t" x="75" y="675">Газ / котельная</text><text class="s" x="75" y="705">К-01 + обмер + ТУ + теплопотери + паспорта B01/B02</text><text class="s" x="75" y="730">Получить: согласованный проект, дымоход, автоматику, акты</text>
  <text class="t" x="75" y="775">ОВиК</text><text class="s" x="75" y="805">В-01 + планы этажей + назначение комнат + потолки</text><text class="s" x="75" y="830">Получить: расходы, сечения, шум, узлы, спецификацию, ПНР</text>
  <text class="s" x="75" y="875">Критерий приёмки: цифры в проекте совпадают с кодами в C4D и на сайте.</text>

  <rect class="sheet" x="560" y="640" width="480" height="265" rx="8"/>
  <text class="t" x="580" y="675">Электрик / слаботочник</text><text class="s" x="580" y="705">планы розеток/света + мощности B01/V01/кухни</text><text class="s" x="580" y="730">Получить: однолинейную схему, группы, кабели, защиту, протоколы</text>
  <text class="t" x="580" y="775">Сантехник / отопление</text><text class="s" x="580" y="805">ВК, приборы, коллекторы, канализация, трапы, рециркуляция</text><text class="s" x="580" y="830">Получить: диаметры, уклоны, узлы, опрессовку, исполнительную</text>
  <text class="s" x="580" y="875">Параллельно можно заказывать мебель только после заморозки чистовых размеров.</text>

  <rect class="sheet" x="1065" y="640" width="480" height="265" rx="8"/>
  <text class="t" x="1085" y="675">Отделочники / мебельщики</text><text class="s" x="1085" y="705">развёртки 4 стен + отметки выводов + образцы материалов</text><text class="s" x="1085" y="730">Получить: раскладку, узлы, карты выкрасов, контрольные обмеры</text>
  <text class="t" x="1085" y="775">Ландшафт / наружные сети</text><text class="s" x="1085" y="805">генплан, посадочный, освещение, полив, дренаж, отметки</text><text class="s" x="1085" y="830">Получить: разбивочный план, ведомость, график посадки и ухода</text>
  <text class="s" x="1085" y="875">Грунт, дренаж и трассы проверяются до мощения и посадок.</text>
</svg>
