<text x="233.00" y="53.00" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Статус: ТРЕБУЕТ ПРОЕКТА БАНИ</text>
<text x="233.00" y="58.30" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Основание: Требование заказчика</text>
<text x="233.00" y="63.60" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Единицы линейных размеров: мм.</text>
<text x="233.00" y="68.90" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Размеры с PDF не заменяют исполнительный обмер.</text>
<text x="233.00" y="74.20" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Красный контур — новое/непроверенное решение H1.</text>
<text x="233.00" y="79.50" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">До закрытия ворот G1–G7 лист не выдавать в монтаж.</text>
<text x="230.00" y="102.00" font-size="3.4" font-weight="700" text-anchor="start" fill="#111" stroke="none">СОСТАВ ПРОЕКТА БАНИ ДО СТРОИТЕЛЬСТВА</text>
<text x="230.00" y="110.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">1. АР: точная планировка, двери, окна, высоты и отделка.</text>
<text x="230.00" y="116.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">2. КР: фундамент по геологии, каркас/кладка, кровля.</text>
<text x="230.00" y="122.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">3. ОВ: приток, вытяжка, воздухообмен, просушка.</text>
<text x="230.00" y="128.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">4. ВК: ввод, слив, трапы, уклоны, защита от замерзания.</text>
<text x="230.00" y="134.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">5. ЭОМ: влажные зоны, защиты, уравнивание потенциалов.</text>
<text x="230.00" y="140.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">6. Печь/дымоход: паспорт, разделки, экраны, пожарные отступы.</text>
<text x="230.00" y="146.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">7. ГП: отметки, дорожка, водоотвод, отступы от сетей.</text>
<text x="40.00" y="168.00" font-size="3.4" font-weight="700" text-anchor="start" fill="#111" stroke="none">ПРИВЯЗКА НА УЧАСТКЕ</text>
<text x="40.00" y="175.00" font-size="3.0" font-weight="400" text-anchor="start" fill="#111" stroke="none">7000 вдоль задней границы; 3000 в глубину участка;</text>
<text x="40.00" y="181.00" font-size="3.0" font-weight="400" text-anchor="start" fill="#111" stroke="none">отступы 1000 слева и 1000 сзади — требование H1.</text>
<text x="40.00" y="187.00" font-size="3.0" font-weight="700" text-anchor="start" fill="#b91c1c" stroke="none">Проверить местные нормы, сети, пожарные разрывы и геодезию.</text>
