<text x="232.00" y="124.00" font-size="2.7" font-weight="700" text-anchor="middle" fill="#166534" stroke="none">свободный световой проём</text>
<text x="170.00" y="147.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">Столешница располагается сбоку от окна;</text>
<text x="170.00" y="153.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">точные отметки — после обмера кладки и оконного проёма.</text>
<rect x="300.00" y="40.00" width="105.00" height="48.00" stroke="#6b7280" fill="#f8fafc" stroke-width="0.35"/>
<text x="303.00" y="46.00" font-size="3.2" font-weight="700" text-anchor="start" fill="#111" stroke="none">ПРИМЕЧАНИЯ</text>
<text x="303.00" y="53.00" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Статус: ТРЕБУЕТ ПЕЧНИКА/ОВ/ВК</text>
<text x="303.00" y="58.30" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Основание: PDF л.7 + фото заказчика</text>
<text x="303.00" y="63.60" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Единицы линейных размеров: мм.</text>
<text x="303.00" y="68.90" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Размеры с PDF не заменяют исполнительный обмер.</text>
<text x="303.00" y="74.20" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Красный контур — новое/непроверенное решение H1.</text>
<text x="303.00" y="79.50" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">До закрытия ворот G1–G7 лист не выдавать в монтаж.</text>
<text x="35.00" y="175.00" font-size="3.5" font-weight="700" text-anchor="start" fill="#111" stroke="none">ОБЯЗАТЕЛЬНЫЕ УЗЛЫ ДЛЯ РАБОЧЕГО ВЫПУСКА</text>
<text x="35.00" y="183.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">1. Печник: топка, шамот, дымосборник, сечение и высота дымохода.</text>
<text x="35.00" y="189.20" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">2. ОВ: независимый расчёт удаления дыма и притока; не использовать общедомовую вентиляцию.</text>
<text x="35.00" y="195.40" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">3. ВК: мойка в столешнице, ХВС/ГВС, сифон, канализация, зимнее опорожнение.</text>
<text x="35.00" y="201.60" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">4. КР: нагрузка кладки на плиту, примыкание к дому, деформационный/пожарный узел.</text>
<text x="35.00" y="207.80" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">5. АР: координация окна, проходов, рабочей поверхности и негорючих облицовок.</text>
<text x="35.00" y="214.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">6. ЭОМ: влагозащищённые розетки вне горячей зоны, свет и аварийное отключение.</text>
</g></svg>