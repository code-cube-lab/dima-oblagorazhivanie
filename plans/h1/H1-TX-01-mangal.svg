<text x="23.00" y="289.00" font-size="2.8" font-weight="700" text-anchor="start" fill="#b91c1c" stroke="none">КООРДИНАЦИЯ. НЕ ДЛЯ МОНТАЖА. НУЖНЫ ОБМЕР, РАСЧЁТ И ПОДПИСИ ПРОФИЛЬНЫХ СПЕЦИАЛИСТОВ.</text>
