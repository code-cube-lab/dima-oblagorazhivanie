<text x="293.00" y="193.30" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Основание: PDF л.7–8 + изменение заказчика</text>
<text x="293.00" y="198.60" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Единицы линейных размеров: мм.</text>
<text x="293.00" y="203.90" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Размеры с PDF не заменяют исполнительный обмер.</text>
<text x="293.00" y="209.20" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">Красный контур — новое/непроверенное решение H1.</text>
<text x="293.00" y="214.50" font-size="2.8" font-weight="400" text-anchor="start" fill="#111" stroke="none">До закрытия ворот G1–G7 лист не выдавать в монтаж.</text>
<text x="35.00" y="210.00" font-size="3.3" font-weight="700" text-anchor="start" fill="#b91c1c" stroke="none">СТОП-УСЛОВИЯ</text>
<text x="35.00" y="217.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">1. Новый дверной проём вместо окна детской — только после обследования стены и расчёта перемычки.</text>
<text x="35.00" y="222.50" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">2. Балконная плита, опоры над гаражом, примыкание и водоотвод — только по КР.</text>
<text x="35.00" y="228.00" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">3. Размеры 1440/1400/8650 — требования H1, подтвердить исполнительным обмером.</text>
<text x="35.00" y="233.50" font-size="2.9" font-weight="400" text-anchor="start" fill="#111" stroke="none">4. Два выхода должны вести на одну непрерывную безопасную площадку без разрыва.</text>
