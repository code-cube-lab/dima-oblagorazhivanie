  <rect class="warn" x="680" y="745" width="865" height="170" rx="8"/>
  <text class="hh" x="700" y="778">До передачи монтажнику обязательно получить</text>
  <text class="s" x="700" y="807">1. Технические условия на газ. 2. Теплопотери и выбранную мощность. 3. Паспорт котла и схему дымоудаления.</text>
  <text class="s" x="700" y="833">4. Обмер помещения, окна/двери/высоту. 5. Расчёт воздухообмена. 6. Анализ воды. 7. Проект лицензированной организации.</text>
  <a href="https://baxi.ru/production/domestic/wall/eco_nova_2025/100023941/" target="_blank"><text class="s link" x="700" y="865">B01 — официальная карточка BAXI ECO Nova 2025 1.24 F</text></a>
  <a href="https://www.rommer.ru/catalog/boylery/napolnyy_kosvennogo_nagreva/rommer-boyler-kosvennogo-nagreva-napolnyy-150-l/" target="_blank"><text class="s link" x="700" y="892">B02 — официальная карточка ROMMER 150 л</text></a>
  <text class="s" x="55" y="950">Статус листа: КООРДИНАЦИЯ / ТЗ. Не рабочий проект газоснабжения и не разрешение на монтаж.</text>
