  <rect class="bg" width="1600" height="1000"/>
  <rect class="sheet" x="24" y="22" width="1552" height="956" rx="8"/>
  <text class="h" x="55" y="66">К-01. Котельная — координационная модель Cinema 4D v20.1</text>
  <text class="s" x="55" y="94">Единицы: мм · помещение на листе 7 PDF: 8,24 м² · модельная граница: 2450 × 2950 · окончательные чистовые размеры — после обмера</text>

