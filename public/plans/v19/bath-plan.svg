<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">БН-01. Эскиз планировки бани три на семь метров</title>
  <desc id="desc">Комната отдыха, моечная и парная с габаритами, мебелью и инженерными заданиями.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M8 0 0 4 8 8Z" fill="#252a26"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#252a26}.h{font-size:28px;font-weight:700}.sub{font-size:13px;letter-spacing:.08em}.label{font-size:15px;font-weight:700}.small{font-size:12px}.dim{font-size:13px;font-weight:700}.wall{stroke:#252a26;stroke-width:10;fill:none}.part{stroke:#252a26;stroke-width:5}.dimline{stroke:#252a26;stroke-width:1.2;fill:none;marker-start:url(#arr);marker-end:url(#arr)}.door{stroke:#4f5d50;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1180" height="760" fill="#f4f1e8"/>
  <text x="54" y="48" class="sub">ДИМА · ОБЛАГОРАЖИВАНИЕ · БН-01 · ЭСКИЗ ДЛЯ СОГЛАСОВАНИЯ</text>
  <text x="54" y="86" class="h">Баня 3,00 × 7,00 м — план и инженерные задания</text>
  <text x="54" y="112" class="small">Вариант планировки. Печь, дымоход, огнезащита, вентиляция, слив и фундамент — только по проектам профильных специалистов.</text>

  <!-- 70 px per metre -->
  <g transform="translate(120 180)">
    <rect x="0" y="0" width="210" height="490" fill="#fff" class="wall"/>
    <rect x="5" y="5" width="200" height="186" fill="#e7d5b9"/>
    <rect x="5" y="196" width="200" height="102" fill="#d6cec1"/>
    <rect x="5" y="303" width="200" height="182" fill="#ead4aa"/>
    <line x1="0" y1="196" x2="210" y2="196" class="part"/>
    <line x1="0" y1="303" x2="210" y2="303" class="part"/>

    <!-- Entrance and inner doors -->
    <path d="M75 490h60M75 490a60 60 0 0 1 60-60" class="door"/>
    <path d="M75 196h56M75 196a56 56 0 0 0 56 56" class="door"/>
    <path d="M80 303h56M80 303a56 56 0 0 1 56-56" class="door"/>

    <!-- Lounge furniture -->
    <rect x="34" y="334" width="112" height="49" rx="3" fill="#7d5b3c"/>
    <rect x="20" y="328" width="12" height="62" rx="3" fill="#b88a5e"/>
    <rect x="150" y="328" width="38" height="62" rx="3" fill="#b88a5e"/>
    <rect x="34" y="405" width="140" height="36" rx="5" fill="#c5aa86"/>
    <rect x="15" y="452" width="60" height="25" fill="#383b38"/>
    <text x="105" y="326" text-anchor="middle" class="label">КОМНАТА ОТДЫХА</text>
    <text x="105" y="347" text-anchor="middle" class="small">3,00 × 2,70 м ≈ 8,1 м²</text>

    <!-- Wash -->
    <rect x="15" y="212" width="78" height="72" fill="#b9b1a5" stroke="#5b5d59" stroke-width="2"/>
    <line x1="20" y1="278" x2="88" y2="278" stroke="#2d4b5b" stroke-width="4"/>
    <rect x="155" y="228" width="36" height="28" rx="6" fill="#f5f3ee" stroke="#5b5d59"/>
    <text x="105" y="216" text-anchor="middle" class="label">МОЕЧНАЯ</text>
    <text x="105" y="289" text-anchor="middle" class="small">3,00 × 1,50 м ≈ 4,5 м²</text>

    <!-- Steam -->
    <rect x="15" y="28" width="125" height="34" rx="4" fill="#c69e69"/>
    <rect x="15" y="70" width="125" height="30" rx="4" fill="#d8b985"/>
    <rect x="154" y="108" width="36" height="48" rx="5" fill="#222"/>
    <circle cx="172" cy="108" r="20" fill="#494b48" stroke="#222" stroke-width="3"/>
    <rect x="144" y="92" width="58" height="82" fill="none" stroke="#b95a2d" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="105" y="129" text-anchor="middle" class="label">ПАРНАЯ</text>
    <text x="105" y="150" text-anchor="middle" class="small">3,00 × 2,80 м ≈ 8,4 м²</text>
    <text x="172" y="184" text-anchor="middle" class="small">печь — по расчёту</text>

    <!-- Dimensions -->
    <path d="M0-26V-8M210-26V-8" stroke="#252a26"/>
    <path d="M0-18H210" class="dimline"/>
    <text x="105" y="-25" text-anchor="middle" class="dim">3 000 мм</text>
    <path d="M-30 0H-8M-30 490H-8" stroke="#252a26"/>
    <path d="M-20 0V490" class="dimline"/>
    <text x="-38" y="245" text-anchor="middle" transform="rotate(-90 -38 245)" class="dim">7 000 мм</text>

    <path d="M232 0H246M232 196H246" stroke="#252a26"/>
    <path d="M240 0V196" class="dimline"/>
    <text x="257" y="98" class="dim">2 800</text>
    <path d="M232 196H246M232 301H246" stroke="#252a26"/>
    <path d="M240 196V301" class="dimline"/>
    <text x="257" y="252" class="dim">1 500</text>
    <path d="M232 301H246M232 490H246" stroke="#252a26"/>
    <path d="M240 301V490" class="dimline"/>
    <text x="257" y="398" class="dim">2 700</text>
  </g>

  <g transform="translate(470 170)">
    <rect x="0" y="0" width="650" height="530" rx="10" fill="#fffdf7" stroke="#c7c0b1"/>
    <text x="28" y="42" class="h" style="font-size:22px">Задания специалистам</text>
    <g transform="translate(28 76)">
      <text x="0" y="0" class="label">АР / планировка</text>
      <text x="0" y="25" class="small">Проверить чистые внутренние размеры, наружную дверь, все проходы и высоту потолка.</text>
      <text x="0" y="47" class="small">Наружная дверь и дверь парной должны открываться по требованиям безопасности.</text>

      <text x="0" y="87" class="label">ВК / слив и вода</text>
      <text x="0" y="112" class="small">Нужны точки ввода, схема зимней консервации, уклоны, трап и место безопасного сброса.</text>
      <text x="0" y="134" class="small">Водоснабжение и канализация не фиксируются до топосъёмки и фактических вводов.</text>

      <text x="0" y="174" class="label">ОВ / вентиляция</text>
      <text x="0" y="199" class="small">Отдельно рассчитать приток парной, вытяжку моечной и просушивание после использования.</text>

      <text x="0" y="239" class="label">Печь и дымоход</text>
      <text x="0" y="264" class="small">Кандидат: «Везувий Скиф Стандарт 16», 16 кВт — только после расчёта объёма парной.</text>
      <text x="0" y="286" class="small">Основание, экран, отступы, проход потолка и кровли проектирует печник/конструктор.</text>

      <text x="0" y="326" class="label">ЭОМ / свет</text>
      <text x="0" y="351" class="small">Влагозащищённые светильники, УЗО, уравнивание потенциалов и выключатели вне горячей зоны.</text>
      <text x="0" y="373" class="small">Сценарии: уборка, отдых, моечная, мягкий свет парной, наружный путь.</text>

      <rect x="0" y="410" width="594" height="82" rx="8" fill="#fff1df" stroke="#e4a766"/>
      <text x="18" y="438" class="label">Статус листа: ЭСКИЗ / BLOCKED для строительства</text>
      <text x="18" y="462" class="small">До рабочего выпуска нужны фундамент, пожарные узлы, вентиляция, ВК, ЭОМ,</text>
      <text x="18" y="480" class="small">геология/грунты, топосъёмка и нормативные отступы.</text>
    </g>
  </g>
</svg>
