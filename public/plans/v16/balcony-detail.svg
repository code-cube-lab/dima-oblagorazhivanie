<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b8663f"/>
    </marker>
    <style>
      .wall{fill:#d7d2c8;stroke:#102d35;stroke-width:3}.glass{fill:#bde6eb;fill-opacity:.75;stroke:#102d35;stroke-width:3}
      .screen{fill:#4f5555;stroke:#102d35;stroke-width:3}.door{fill:#c7edf0;stroke:#102d35;stroke-width:4}
      .dim{stroke:#b8663f;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}.ext{stroke:#b8663f;stroke-width:1.5}
      text{font-family:Segoe UI,Arial,sans-serif;fill:#102d35}.label{font-size:22px;font-weight:700}.note{font-size:17px}.dtext{font-size:19px;font-weight:700;fill:#b8663f}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f4f0e7"/>
  <text x="65" y="52" class="label">Фасадный узел общего балкона v16 · вид с улицы · не зеркалить</text>
  <text x="65" y="82" class="note">Гараж слева. Передняя часть балкона перекрывает весь гараж и доходит до новой двери детской.</text>

  <rect x="120" y="135" width="945" height="425" class="wall"/>
  <rect x="120" y="380" width="317" height="180" fill="#9ca09d" stroke="#102d35" stroke-width="4"/>
  <line x1="120" y1="425" x2="437" y2="425" stroke="#102d35" stroke-width="3"/>
  <line x1="120" y1="470" x2="437" y2="470" stroke="#102d35" stroke-width="3"/>
  <line x1="120" y1="515" x2="437" y2="515" stroke="#102d35" stroke-width="3"/>
  <text x="214" y="535" class="label">ГАРАЖ</text>

  <rect x="471" y="190" width="104" height="190" class="door"/>
  <line x1="523" y1="190" x2="523" y2="380" stroke="#102d35" stroke-width="3"/>
  <text x="448" y="170" class="note">новая дверь детской</text>
  <rect x="712" y="220" width="78" height="160" class="door"/>
  <text x="700" y="202" class="note">верхнее окно</text>
  <rect x="900" y="180" width="98" height="380" class="door"/>
  <text x="873" y="163" class="note">высокий витраж</text>

  <rect x="120" y="344" width="488" height="22" fill="#5b514a" stroke="#102d35" stroke-width="3"/>
  <rect x="120" y="266" width="488" height="78" class="glass"/>
  <line x1="185" y1="266" x2="185" y2="344" stroke="#102d35" stroke-width="3"/>
  <line x1="250" y1="266" x2="250" y2="344" stroke="#102d35" stroke-width="3"/>
  <line x1="315" y1="266" x2="315" y2="344" stroke="#102d35" stroke-width="3"/>
  <line x1="380" y1="266" x2="380" y2="344" stroke="#102d35" stroke-width="3"/>
  <line x1="445" y1="266" x2="445" y2="344" stroke="#102d35" stroke-width="3"/>
  <line x1="510" y1="266" x2="510" y2="344" stroke="#102d35" stroke-width="3"/>
  <rect x="120" y="227" width="16" height="139" class="screen"/>
  <rect x="592" y="227" width="16" height="139" class="screen"/>

  <line x1="120" y1="610" x2="608" y2="610" class="dim"/>
  <line x1="120" y1="575" x2="120" y2="625" class="ext"/>
  <line x1="608" y1="575" x2="608" y2="625" class="ext"/>
  <text x="318" y="600" class="dtext">7,50 м</text>
  <text x="247" y="648" class="note">полная ширина передней части</text>

  <line x1="77" y1="266" x2="77" y2="344" class="dim"/>
  <line x1="77" y1="266" x2="115" y2="266" class="ext"/>
  <line x1="77" y1="344" x2="115" y2="344" class="ext"/>
  <text x="24" y="313" class="dtext">1,20 м</text>

  <line x1="642" y1="227" x2="642" y2="366" class="dim"/>
  <line x1="612" y1="227" x2="655" y2="227" class="ext"/>
  <line x1="612" y1="366" x2="655" y2="366" class="ext"/>
  <text x="658" y="303" class="dtext">1,80 м</text>
  <text x="675" y="329" class="note">высокие торцевые экраны</text>

  <path d="M608 355 C690 400 720 420 735 455" fill="none" stroke="#61765d" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="665" y="485" class="note">соединение с боковой частью 1,40 × 8,65 м</text>
  <text x="665" y="510" class="note">и существующим выходом из спальни родителей</text>

  <rect x="795" y="585" width="335" height="83" rx="10" fill="#102d35"/>
  <text x="815" y="615" style="font-size:16px;fill:#fff;font-weight:700">ДО СТРОИТЕЛЬСТВА:</text>
  <text x="815" y="641" style="font-size:14px;fill:#d7e4e4">обмер, обследование плиты/стен, расчёт</text>
  <text x="815" y="660" style="font-size:14px;fill:#d7e4e4">опор, анкеровки и усиления нового проёма.</text>
</svg>
