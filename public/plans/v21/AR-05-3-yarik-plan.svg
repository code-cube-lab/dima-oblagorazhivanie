<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>
    .bg{fill:#fff}.frame,.wall,.obj,.door{stroke:#111;stroke-width:2;fill:none}.wall{fill:#d8d8d4}.room{fill:#fff}.obj{fill:#dbe4ef}.play{fill:#e5eee4;stroke:#55766b;stroke-width:1.5}.dim{stroke:#b12f2f;stroke-width:1.5;fill:none}.h{font:bold 27px Arial;fill:#111}.t{font:19px Arial;fill:#111}.s{font:15px Arial;fill:#111}.xs{font:13px Arial;fill:#111}.mono{font:13px Consolas,monospace;fill:#111}.note{fill:#fff3d7;stroke:#b66a00;stroke-width:2}
  </style><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0 0 4 8 8Z" fill="#b12f2f"/></marker></defs>
  <rect class="bg" width="1600" height="1000"/><rect class="frame" x="25" y="25" width="1550" height="950"/>
  <text class="h" x="50" y="68">АР-05.3. Детская Ярика — план расстановки</text>
  <text class="s" x="50" y="96">Размеры в мм · вид сверху · хранение спортивной формы отделено от свободной игровой зоны</text>
  <g transform="translate(75 155)">
    <rect class="wall" width="810" height="589"/><rect class="room" x="24" y="24" width="762" height="541"/>
    <rect class="obj" x="75" y="249" width="140" height="304"/><text class="t" x="95" y="395">Пенни-1</text><text class="s" x="87" y="423">940×2040×760</text>
    <rect class="obj" x="575" y="64" width="180" height="90"/><text class="s" x="620" y="104">стол 1200</text><text class="xs" x="595" y="128">рабочее место</text>
    <rect class="obj" x="638" y="448" width="120" height="80"/><text class="s" x="654" y="482">шкаф</text><text class="xs" x="652" y="505">900×600</text>
    <rect class="obj" x="630" y="330" width="130" height="78"/><text class="xs" x="644" y="363">форма / мячи</text><text class="xs" x="653" y="385">закрытое хранение</text>
    <rect class="play" x="300" y="205" width="270" height="270"/><text class="t" x="348" y="330">свободная игровая</text><text class="s" x="370" y="360">не загромождать</text>
    <path class="door" d="M690 589v-24m0 0a96 96 0 0 0-96-96"/><text class="s" x="636" y="540">вход</text>
    <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M0 625h810"/><text class="t" x="372" y="653">5430</text>
    <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M846 0v589"/><text class="t" transform="translate(876 267) rotate(90)">3950</text>
  </g>
  <g transform="translate(960 160)">
    <text class="t">Привязки для меблировщика</text>
    <text class="s" y="42">• Пенни-1: 2040×940×760 — вдоль левой стены.</text>
    <text class="s" y="72">• Стол Дикинс: 1200×600×760 — у естественного света.</text>
    <text class="s" y="102">• Шкаф 900 и спортхранение — у входа.</text>
    <text class="s" y="132">• Центральную игровую зону не занимать.</text>
    <rect class="note" y="175" width="560" height="190"/>
    <text class="t" x="22" y="211">Что проверить на объекте</text>
    <text class="s" x="22" y="246">1. Чистовые 5430×3950 и положение окна.</text>
    <text class="s" x="22" y="276">2. Дверную створку и путь эвакуации.</text>
    <text class="s" x="22" y="306">3. Розетки стола и ночной подсветки.</text>
    <text class="s" x="22" y="336">4. Анкерование высокой мебели к стене.</text>
    <text class="mono" y="425">Связанные C4D-камеры: CAM_16, CAM_43</text>
    <text class="mono" y="453">Развёртки стен: лист АР-08</text>
    <text class="mono" y="481">Основание: PDF лист 8</text>
  </g>
  <rect class="frame" x="920" y="790" width="655" height="185"/><path class="frame" d="M920 845h655M1200 790v185M1450 790v185M920 920h655"/>
  <text class="s" x="940" y="820">Дима — благоустройство · Ставрополь</text><text class="t" x="940" y="885">Детская Ярика. План</text><text class="xs" x="940" y="948">Эскиз/координация — не рабочая документация</text>
  <text class="xs" x="1220" y="820">Стадия ЭП</text><text class="xs" x="1220" y="875">Масштаб граф.</text><text class="xs" x="1470" y="820">АР-05.3</text><text class="xs" x="1470" y="875">v21</text>
</svg>
