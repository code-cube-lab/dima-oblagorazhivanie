<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>
    .b{fill:#fff}.frame{fill:none;stroke:#111;stroke-width:2}.wall{fill:#d9d9d9;stroke:#111;stroke-width:2}.f{fill:#eef1f2;stroke:#111;stroke-width:1.5}.soft{fill:#e8ddd3;stroke:#111;stroke-width:1.5}.dim{stroke:#b12f2f;stroke-width:1.5;fill:none}.t{font:18px Arial;fill:#111}.s{font:14px Arial;fill:#111}.xs{font:12px Arial;fill:#111}.h{font:bold 25px Arial;fill:#111}.mono{font:13px Consolas,monospace;fill:#111}.warn{fill:#fff3d7;stroke:#b66a00;stroke-width:2}
  </style><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0 0 4 8 8Z" fill="#b12f2f"/></marker></defs>
  <rect class="b" width="1600" height="1000"/><rect class="frame" x="25" y="25" width="1550" height="950"/>
  <text class="h" x="50" y="65">АР-05. План расстановки мебели — спальни 2 этажа</text>
  <text class="s" x="50" y="92">Паспортные габариты мебели из реестра v21. Координаты переносятся в Cinema 4D v20.2. Размеры в мм.</text>

  <text class="t" x="60" y="135">1. Спальня родителей — 4430 × 3640</text>
  <rect class="wall" x="60" y="155" width="354" height="291"/><rect class="b" x="73" y="168" width="328" height="265"/>
  <rect class="soft" x="170" y="252" width="148" height="162"/><text class="s" x="190" y="332">Нордик 180</text><text class="xs" x="185" y="350">1850×2030×980</text>
  <rect class="f" x="115" y="311" width="42" height="34"/><text class="xs" x="110" y="303">тумба</text>
  <rect class="f" x="335" y="311" width="42" height="34"/><text class="xs" x="333" y="303">тумба</text>
  <rect class="f" x="319" y="180" width="70" height="36"/><text class="xs" x="326" y="202">стол Олеси</text>
  <path class="frame" d="M60 360h13m0-55v110"/><text class="xs" x="78" y="388">дверь на общий балкон</text>
  <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M60 470h354"/><text class="s" x="210" y="492">4430</text>
  <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M438 155v291"/><text class="s" transform="translate(460 283) rotate(90)">3640</text>

  <text class="t" x="555" y="135">2. Детская Дарины — 4450 × 3950</text>
  <rect class="wall" x="555" y="155" width="356" height="316"/><rect class="b" x="568" y="168" width="330" height="290"/>
  <rect class="soft" x="610" y="257" width="75" height="163"/><text class="xs" x="617" y="340">Пенни-1</text><text class="xs" x="610" y="358">940×2040×760</text>
  <rect class="f" x="782" y="180" width="96" height="48"/><text class="xs" x="800" y="208">стол 1200</text>
  <rect class="f" x="790" y="405" width="100" height="38"/><text class="xs" x="803" y="429">шкаф 1250</text>
  <rect fill="#dba6bd" stroke="#111" x="575" y="330" width="92" height="115"/><text class="xs" x="580" y="389">мат</text>
  <rect class="f" x="572" y="238" width="18" height="96"/><text class="xs" x="598" y="251">гимнастическая</text><text class="xs" x="598" y="269">стенка</text>
  <path class="frame" d="M680 155v13m-45 0h90"/><text class="xs" x="622" y="188">новая дверь на общий балкон</text>
  <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M555 495h356"/><text class="s" x="704" y="517">4450</text>
  <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M935 155v316"/><text class="s" transform="translate(957 289) rotate(90)">3950</text>

  <text class="t" x="1050" y="135">3. Детская Ярика — 5430 × 3950</text>
  <rect class="wall" x="1050" y="155" width="434" height="316"/><rect class="b" x="1063" y="168" width="408" height="290"/>
  <rect class="soft" x="1110" y="257" width="75" height="163"/><text class="xs" x="1117" y="340">Пенни-1</text><text class="xs" x="1110" y="358">940×2040×760</text>
  <rect class="f" x="1340" y="180" width="96" height="48"/><text class="xs" x="1358" y="208">стол 1200</text>
  <rect class="f" x="1378" y="395" width="72" height="38"/><text class="xs" x="1382" y="419">шкаф 900</text>
  <rect fill="#b7c9e5" stroke="#111" x="1230" y="300" width="136" height="148"/><text class="xs" x="1265" y="372">свободная</text><text class="xs" x="1271" y="390">игровая</text>
  <circle fill="#fff" stroke="#111" cx="1405" cy="360" r="14"/><text class="xs" x="1424" y="365">мяч/хранение формы</text>
  <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M1050 495h434"/><text class="s" x="1244" y="517">5430</text>
  <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M1508 155v316"/><text class="s" transform="translate(1530 289) rotate(90)">3950</text>

  <rect class="warn" x="50" y="555" width="920" height="260"/>
  <text class="t" x="70" y="590">Условные обозначения и правила монтажа</text>
  <text class="s" x="70" y="622">1. Контрольные проходы между мебелью и стенами измерить после чистовой отделки.</text>
  <text class="s" x="70" y="650">2. Розетки, бра и выключатели привязывать от осей конкретной мебели, а не «примерно по стене».</text>
  <text class="s" x="70" y="678">3. Новую дверь детской на балкон выполнить только после расчёта усиления проёма и узла гидроизоляции.</text>
  <text class="s" x="70" y="706">4. Высокие детские экраны и ограждение общего балкона — отдельный конструктивный лист.</text>
  <text class="s" x="70" y="734">5. Кровати и столы — по паспортам K/F-04…F-08; шкафы — только после чистового обмера.</text>
  <text class="s" x="70" y="774">СПДС-ориентир: ГОСТ Р 21.101-2020 и ГОСТ 21.501-2018. Статус: координация, не рабочая документация.</text>

  <rect class="frame" x="50" y="835" width="920" height="120"/>
  <text class="mono" x="65" y="860">Связанные рендеры Cinema 4D: CAM_14/CAM_41 — родители; CAM_15/CAM_42 — Дарина; CAM_16/CAM_43 — Ярик.</text>
  <text class="mono" x="65" y="885">Связанный файл модели: Дима_Облагораживание_Master_v20_2.c4d</text>
  <text class="mono" x="65" y="910">Основание геометрии: PDF, лист 8 + изменения заказчика по общему балкону.</text>

  <rect class="frame" x="980" y="835" width="595" height="140"/>
  <path class="frame" d="M980 885h595M1240 835v140M1455 835v140M980 930h595"/>
  <text class="xs" x="995" y="858">Дима — благоустройство</text><text class="xs" x="995" y="878">Дом и участок, Ставрополь</text>
  <text class="t" x="995" y="912">План мебели. Спальни</text><text class="xs" x="995" y="951">Эскиз / координация</text>
  <text class="xs" x="1255" y="858">Стадия</text><text class="t" x="1320" y="880">ЭП</text><text class="xs" x="1255" y="910">Масштаб</text><text class="t" x="1330" y="925">граф.</text>
  <text class="xs" x="1470" y="858">Лист</text><text class="t" x="1520" y="880">АР-05</text><text class="xs" x="1470" y="910">30.07.2026</text><text class="xs" x="1470" y="951">v21</text>
</svg>
