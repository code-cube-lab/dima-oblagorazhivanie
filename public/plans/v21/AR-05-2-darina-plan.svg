<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>
    .bg{fill:#fff}.frame,.wall,.obj,.door,.axis{stroke:#111;stroke-width:2;fill:none}.wall{fill:#d8d8d4}.room{fill:#fff}.obj{fill:#eadde5}.sport{fill:#d7e6df;stroke:#55766b;stroke-width:1.5}.clear{fill:#f7eee8;stroke:#b8663f;stroke-width:1.5}.dim{stroke:#b12f2f;stroke-width:1.5;fill:none}.h{font:bold 27px Arial;fill:#111}.t{font:19px Arial;fill:#111}.s{font:15px Arial;fill:#111}.xs{font:13px Arial;fill:#111}.mono{font:13px Consolas,monospace;fill:#111}.note{fill:#fff3d7;stroke:#b66a00;stroke-width:2}
  </style><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0 0 4 8 8Z" fill="#b12f2f"/></marker></defs>
  <rect class="bg" width="1600" height="1000"/><rect class="frame" x="25" y="25" width="1550" height="950"/>
  <text class="h" x="50" y="68">АР-05.2. Детская Дарины — план расстановки</text>
  <text class="s" x="50" y="96">Размеры в мм · вид сверху · новая дверь на общий балкон показана как изменение заказчика</text>
  <g transform="translate(95 145)">
    <rect class="wall" width="680" height="604"/><rect class="room" x="24" y="24" width="632" height="556"/>
    <rect class="obj" x="78" y="258" width="144" height="312"/><text class="t" x="101" y="405">Пенни-1</text><text class="s" x="92" y="433">940×2040×760</text>
    <rect class="obj" x="430" y="62" width="190" height="92"/><text class="s" x="476" y="101">стол 1200</text><text class="xs" x="455" y="125">рабочее место</text>
    <rect class="obj" x="440" y="487" width="190" height="70"/><text class="s" x="482" y="528">шкаф 1250</text>
    <rect class="sport" x="55" y="92" width="38" height="175"/><text class="s" x="108" y="160">гимнастическая</text><text class="s" x="108" y="184">стенка</text>
    <rect class="sport" x="110" y="105" width="185" height="135"/><text class="s" x="170" y="175">мат</text>
    <rect class="clear" x="297" y="260" width="275" height="188"/><text class="t" x="344" y="345">свободная зона</text><text class="s" x="350" y="374">игра / гимнастика</text>
    <path class="door" d="M255 0v24m0 0a112 112 0 0 0 112 112"/><text class="s" x="168" y="-18">НОВАЯ дверь на общий балкон</text>
    <path class="door" d="M590 604v-24m0 0a95 95 0 0 0-95-95"/><text class="s" x="520" y="555">вход</text>
    <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M0 640h680"/><text class="t" x="306" y="668">4450</text>
    <path class="dim" marker-start="url(#a)" marker-end="url(#a)" d="M716 0v604"/><text class="t" transform="translate(746 275) rotate(90)">3950</text>
  </g>
  <g transform="translate(900 150)">
    <text class="t">Привязки для меблировщика</text>
    <text class="s" y="42">• Пенни-1: 2040×940×760 — вдоль левой стены.</text>
    <text class="s" y="72">• Стол Милна: 1200×600×750 — возле естественного света.</text>
    <text class="s" y="102">• Шкаф 1250 — у входной стены.</text>
    <text class="s" y="132">• Центр комнаты сохраняется свободным.</text>
    <rect class="note" y="175" width="610" height="220"/>
    <text class="t" x="22" y="211">Обязательные проверки</text>
    <text class="s" x="22" y="246">1. Новый проём — расчёт конструктора до работ.</text>
    <text class="s" x="22" y="276">2. Узлы порога, гидроизоляции и примыкания.</text>
    <text class="s" x="22" y="306">3. Детское ограждение балкона без лазания.</text>
    <text class="s" x="22" y="336">4. Крепёж спортстенки — по материалу стены.</text>
    <text class="s" x="22" y="366">5. Розетки не размещать в зоне спортснаряда.</text>
    <text class="mono" y="455">Связанные C4D-камеры: CAM_15, CAM_42</text>
    <text class="mono" y="483">Развёртки стен: лист АР-07</text>
    <text class="mono" y="511">Основание: PDF лист 8 + изменение заказчика</text>
  </g>
  <rect class="frame" x="900" y="790" width="675" height="185"/><path class="frame" d="M900 845h675M1195 790v185M1445 790v185M900 920h675"/>
  <text class="s" x="920" y="820">Дима — благоустройство · Ставрополь</text><text class="t" x="920" y="885">Детская Дарины. План</text><text class="xs" x="920" y="948">Эскиз/координация — не рабочая документация</text>
  <text class="xs" x="1215" y="820">Стадия ЭП</text><text class="xs" x="1215" y="875">Масштаб граф.</text><text class="xs" x="1460" y="820">АР-05.2</text><text class="xs" x="1460" y="875">v21</text>
</svg>
