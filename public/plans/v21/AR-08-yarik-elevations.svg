<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>.b{fill:#fff}.f{fill:none;stroke:#111;stroke-width:2}.wall{fill:#f4f4f2;stroke:#111;stroke-width:2}.obj{fill:#dce6f3;stroke:#111;stroke-width:1.5}.t{font:18px Arial}.s{font:14px Arial}.h{font:bold 25px Arial}.warn{fill:#fff3d7;stroke:#b66a00;stroke-width:2}</style></defs>
  <rect class="b" width="1600" height="1000"/><rect class="f" x="25" y="25" width="1550" height="950"/>
  <text class="h" x="50" y="65">АР-08. Детская Ярика — развёртки четырёх стен</text><text class="s" x="50" y="92">Комната 5430 × 3950. Центральная игровая зона сохраняется свободной.</text>
  <g transform="translate(60 140)"><text class="t" y="-15">А. Фасадная стена, L=5430</text><rect class="wall" width="680" height="280"/><rect class="b" stroke="#111" stroke-width="2" x="300" y="65" width="150" height="190"/><text class="s" x="310" y="45">существующее окно</text><rect class="obj" x="500" y="185" width="130" height="70"/><text class="s" x="505" y="223">Дикинс 1200×600×760</text></g>
  <g transform="translate(835 140)"><text class="t" y="-15">Б. Стена хранения, L=5430</text><rect class="wall" width="680" height="280"/><rect class="obj" x="500" y="45" width="120" height="235"/><text class="s" x="505" y="35">шкаф 900</text><rect class="obj" x="335" y="190" width="145" height="70"/><text class="s" x="346" y="225">форма и мячи</text><text class="s" x="70" y="150">не размещать навесную мебель над активной зоной</text></g>
  <g transform="translate(60 520)"><text class="t" y="-15">В. Стена кровати, L=3950</text><rect class="wall" width="680" height="250"/><rect class="obj" x="105" y="112" width="250" height="138"/><text class="s" x="135" y="183">Пенни-1 940×2040×760</text><text class="s" x="375" y="190">ночник + розетка вне зоны головы</text></g>
  <g transform="translate(835 520)"><text class="t" y="-15">Г. Стена входа, L=3950</text><rect class="wall" width="680" height="250"/><rect class="b" stroke="#111" stroke-width="2" x="75" y="65" width="125" height="185"/><text class="s" x="80" y="55">дверь 900 — проверить</text><text class="s" x="280" y="145">свободная игровая стена / проектор по желанию</text></g>
  <rect class="warn" x="50" y="810" width="900" height="120"/><text class="s" x="70" y="845">Рендеры рядом на сайте: CAM_16 и CAM_43. До заказа мебели проверить открывание двери и фактический подоконник.</text><text class="s" x="70" y="875">Основание: PDF лист 8; все чистовые размеры подтвердить обмером. СПДС-ориентир: ГОСТ Р 21.101-2020. Статус: эскиз/координация.</text>
  <rect class="f" x="980" y="820" width="595" height="155"/><path class="f" d="M980 870h595M1240 820v155M1455 820v155M980 925h595"/><text class="s" x="995" y="848">Дима — благоустройство</text><text class="t" x="995" y="900">Детская Ярика</text><text class="s" x="995" y="948">Развёртки стен</text><text class="s" x="1260" y="848">Стадия ЭП</text><text class="s" x="1260" y="900">Масштаб граф.</text><text class="s" x="1470" y="848">АР-08</text><text class="s" x="1470" y="900">v21</text>
